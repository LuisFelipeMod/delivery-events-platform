name: delivery

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 5s
      retries: 30

  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
      SQS_ENDPOINT_STRATEGY: path

  localstack-init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    entrypoint: ["bash", "/init.sh"]
    volumes:
      - ./scripts/init-localstack.sh:/init.sh:ro

  orders-service:
    build:
      context: ./services/orders-service
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:order-created
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully

  fulfillment-service:
    build:
      context: ./services/fulfillment-service
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Path-style URL on the compose network. LocalStack's get-queue-url host
      # is not reliable from another container, so the queue name is fixed.
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-created
      DYNAMODB_TABLE: fulfillments
      POLL_WAIT_SECONDS: "2"
      VISIBILITY_TIMEOUT_SECONDS: "30"
      CONSUMER_ENABLED: "true"
      LOG_LEVEL: info
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      localstack-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        VITE_ORDERS_API_URL: http://localhost:3001
        VITE_FULFILLMENT_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - orders-service
      - fulfillment-service
