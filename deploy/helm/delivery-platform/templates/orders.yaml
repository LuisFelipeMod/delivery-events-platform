apiVersion: v1
kind: Secret
metadata:
  name: {{ include "delivery.fullname" . }}-orders
  labels:
    {{- include "delivery.orders.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "delivery.databaseUrl" . | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.orders.serviceAccount.name }}
  labels:
    {{- include "delivery.orders.labels" . | nindent 4 }}
  {{- with .Values.orders.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "delivery.fullname" . }}-orders
  labels:
    {{- include "delivery.orders.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "delivery.orders.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.orders.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "delivery.fullname" . }}-orders
  labels:
    {{- include "delivery.orders.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orders.replicaCount }}
  selector:
    matchLabels:
      {{- include "delivery.orders.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "delivery.orders.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.orders.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: orders
          image: "{{ .Values.orders.image.repository }}:{{ .Values.orders.image.tag }}"
          imagePullPolicy: {{ .Values.orders.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orders.service.port }}
          env:
            - name: PORT
              value: {{ .Values.orders.service.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "delivery.fullname" . }}-orders
                  key: DATABASE_URL
            - name: SNS_TOPIC_ARN
              value: {{ .Values.orders.snsTopicArn | quote }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.orders.logLevel | quote }}
            {{- if .Values.aws.endpointUrl }}
            - name: AWS_ENDPOINT_URL
              value: {{ .Values.aws.endpointUrl | quote }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.aws.accessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.aws.secretAccessKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.orders.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
